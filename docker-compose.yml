services:
  postgres:
    image: postgres:17
    container_name: devin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - devin_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devin-redis
    ports:
      - '6380:6379'
    volumes:
      - devin_redis:/data

volumes:
  devin_postgres:
  devin_redis:
